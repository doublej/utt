excluded:
  - .build
  - Packages
  # Root-relative '.build' does not match nested checkouts, so SPM's vendored
  # sources get linted too (~12k violations). These catch them.
  - UttCore/.build
  - spike
  # Agent worktrees are checkouts of this repo — linting them lints the same
  # files twice, at whatever commit they happen to sit on.
  - .claude/worktrees
  - Utt.xcodeproj

# 20 is SwiftLint's default and it is wrong for this codebase: an AVAudioEngine
# setup or a reducer that merges three effects is one idea, and splitting it to
# satisfy a counter makes it harder to read, not easier.
function_body_length:
  warning: 40
  error: 60

file_length:
  warning: 300
  error: 400

custom_rules:
  bare_nsapp_activate:
    name: "Ineffective NSApp.activate()"
    # macOS 14 cooperative activation: a background or accessory app is never yielded
    # activation, so this call silently does nothing and the window opens behind other
    # apps. See AppActivation.swift for the measurements.
    regex: '\bNSApp(lication\.shared)?\.activate\(\s*\)'
    message: "NSApp.activate() is a no-op for a background/accessory app — use AppActivation.front()"
    severity: error
    excluded_match_kinds:
      - comment
      - doccomment

disabled_rules:
  - todo
  - line_length
